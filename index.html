      <section id="how-to-play" style="margin-bottom:36px;">
        <h2 style="font-size:1.5rem;border-bottom:2px solid #e0e0ec;padding-bottom:6px;">How to play Football Wordle</h2>
        <ol style="padding-left:1.4rem;">
          <li style="margin-bottom:8px;"><strong>Choose a mode:</strong> Guess players (footballer last names) or Guess clubs (top-flight team names).</li>
          <li style="margin-bottom:8px;"><strong>Type a name</strong> and press Enter. Accents are handled automatically — just type plain letters.</li>
          <li style="margin-bottom:8px;"><strong>Read the color hints:</strong>
            <ul style="margin:.5rem 0;padding-left:1.2rem;">
              <li><strong style="color:#16a34a;">Green</strong> — correct letter in the correct position.</li>
              <li><strong style="color:#a16207;">Yellow</strong> — letter is in the answer but in the wrong position.</li>
              <li><strong style="color:#b91c1c;">Red</strong> — letter does not appear in the answer at all.</li>
            </ul>
          </li>
          <li style="margin-bottom:8px;">Use the hints to refine your next guess. Keep green letters in place. Move yellow letters to a new position. Never reuse red letters.</li>
          <li>You have <strong>6 guesses</strong> per round. Most players solve it in 3 or 4 once they learn the system.</li>
        </ol>
      </section>

      <section id="leagues" style="margin-bottom:36px;">
        <h2 style="font-size:1.5rem;border-bottom:2px solid #e0e0ec;padding-bottom:6px;">Leagues covered</h2>
        <p>Football Wordle draws names from six major leagues, each with its own naming traditions:</p>
        <ul style="padding-left:1.4rem;">
          <li style="margin-bottom:10px;"><strong>🏴󠁧󠁢󠁥󠁮󠁧󠁿 Premier League</strong> — The most diverse league in Football Wordle. Short English names (RICE, KANE, SHAW) alongside West African names (ONANA, SAKA, TROSSARD) and Scandinavian double-vowels (HAALAND, ODEGAARD). 20 clubs, the highest name variety of any league.</li>
          <li style="margin-bottom:10px;"><strong>🇪🇸 La Liga</strong> — Consistent vowel-heavy patterns. Spanish surnames end in -EZ (SANCHEZ, RAMIREZ), -O (SERGIO, MARCO), or -A (SILVA, RAMOS). South American players add Italian-origin names. Once you recognise the endings, La Liga names become much easier to narrow down.</li>
          <li style="margin-bottom:10px;"><strong>🇩🇪 Bundesliga</strong> — German names feature consonant clusters — KIMMICH, GNABRY, GORETZKA, NEUER. Medium length (5–7 letters), compound structures, and a growing African and South American presence make Bundesliga names moderately challenging.</li>
          <li style="margin-bottom:10px;"><strong>🇮🇹 Serie A</strong> — Italian surnames almost always end in vowels: -I (BONUCCI, BARELLA) or -O (INSIGNE, IMMOBILE). Argentine stars like DYBALA add double-letter patterns. Vowel-rich names mean letters confirm early — a key advantage.</li>
          <li style="margin-bottom:10px;"><strong>🇫🇷 Ligue 1</strong> — The most nationally diverse league. West African naming traditions produce consonant clusters at word starts: NKUNKU, MBAPPE, THURAM. North African names add further variety. Ligue 1 produces the hardest names in the game on average.</li>
          <li style="margin-bottom:10px;"><strong>🇺🇸 MLS</strong> — English and Hispanic surnames from American and Canadian players, plus recognisable European transfers. Names tend to be shorter and follow familiar English patterns — an accessible entry point for newer players.</li>
        </ul>
        <p><a href="/blog/football-leagues-guide.html">Read the full leagues guide with naming tips →</a></p>
      </section>

      <section id="name-types" style="margin-bottom:36px;">
        <h2 style="font-size:1.5rem;border-bottom:2px solid #e0e0ec;padding-bottom:6px;">Name difficulty guide</h2>
        <p>Football Wordle includes names across a wide difficulty range. Knowing the categories helps you prepare:</p>
        <ul style="padding-left:1.4rem;">
          <li style="margin-bottom:10px;"><strong>Easier — Short English names:</strong> Known to any football fan globally. KANE, RICE, SHAW, WARD, JAMES. Short length means fewer unknown positions from the start.</li>
          <li style="margin-bottom:10px;"><strong>Moderate — Spanish &amp; Italian names:</strong> Consistent vowel patterns. SILVA, RAMOS, BARELLA, SANCHEZ, DYBALA. Spot the ending and your candidate list shrinks quickly.</li>
          <li style="margin-bottom:10px;"><strong>Moderate — Scandinavian &amp; Dutch names:</strong> Double-vowel combinations (AA in HAALAND, OO in Dutch names). HAALAND, ODEGAARD, ERIKSEN, TROSSARD. Distinctive once you know the pattern.</li>
          <li style="margin-bottom:10px;"><strong>Harder — West African &amp; Eastern European names:</strong> Unfamiliar consonant clusters (MB, ND, NK at the start) or unusual combinations (SZ, GV). ONANA, KIMMICH, SZOBOSZLAI, KVARATSKHELIA. Requires broad multi-league knowledge.</li>
        </ul>
        <p><a href="/blog/hardest-names.html">Read the hardest name categories guide with strategies →</a></p>
      </section>

      <section id="strategy" style="margin-bottom:36px;">
        <h2 style="font-size:1.5rem;border-bottom:2px solid #e0e0ec;padding-bottom:6px;">Strategy tips</h2>
        <ul style="padding-left:1.4rem;">
          <li style="margin-bottom:8px;"><strong>Open with high-frequency letters.</strong> A, E, R, S, and N appear most often across football names. Use an opener like SILVA, MORAN, or LANES to probe as many of these as possible.</li>
          <li style="margin-bottom:8px;"><strong>Never reuse red letters.</strong> A red tile permanently eliminates that letter. Before submitting each guess, scan every previous red tile. This is the most common mistake.</li>
          <li style="margin-bottom:8px;"><strong>Always include yellow letters.</strong> Yellow means confirmed in the answer — just wrong position. Never drop a yellow letter from your next guess.</li>
          <li style="margin-bottom:8px;"><strong>Filter by league once you have 2–3 letters.</strong> Ends in -EZ? Think La Liga or Argentina. Starts with MB or ND? Think West African from Ligue 1 or Premier League. Contains AA or OO? Think Dutch or Scandinavian.</li>
          <li style="margin-bottom:8px;"><strong>Check name length before your first guess.</strong> 4-letter names often point to English or South American players. 7–8 letters suggest German, French, or Eastern European origins.</li>
        </ul>
        <p><a href="/blog/strategy-guide.html">Read the complete strategy guide →</a></p>
      </section>

      <section id="faq" style="margin-bottom:36px;">
        <h2 style="font-size:1.5rem;border-bottom:2px solid #e0e0ec;padding-bottom:6px;">Frequently asked questions</h2>
        <dl>
          <dt style="font-weight:700;margin-top:14px;">Is Football Wordle free?</dt>
          <dd>Yes. The game is completely free to play in your browser with no subscription or sign-up required.</dd>
          <dt style="font-weight:700;margin-top:14px;">Can I play more than once a day?</dt>
          <dd>Yes. Unlike daily Wordle, Football Wordle has no daily limit. Start a new round immediately after each game and play as many as you like.</dd>
          <dt style="font-weight:700;margin-top:14px;">Do I need to type accents?</dt>
          <dd>No. All names are normalised to basic Latin letters automatically. Type MBAPPE not MBAPPÉ, MODRIC not MODRIĆ.</dd>
          <dt style="font-weight:700;margin-top:14px;">What does Clubs mode use as the answer?</dt>
          <dd>The most distinctive keyword from the club’s name. WOLVES not WOLVERHAMPTON, FOREST not NOTTINGHAM FOREST, SPURS not TOTTENHAM HOTSPUR.</dd>
          <dt style="font-weight:700;margin-top:14px;">How often are names updated?</dt>
          <dd>Weekly during the football season and after major transfer windows. New stars are added when they reach global recognisability; retired or irrelevant names are removed.</dd>
          <dt style="font-weight:700;margin-top:14px;">What data does Football Wordle store?</dt>
          <dd>Only your game stats (streak, win rate, guess distribution) saved locally in your browser. Nothing is sent to a server. Clearing browser data resets the stats.</dd>
          <dt style="font-weight:700;margin-top:14px;">Is Football Wordle affiliated with the original Wordle?</dt>
          <dd>No. Football Wordle is an independent fan project. Not affiliated with the New York Times, any official football league, club, or governing body.</dd>
        </dl>
